name: Deploy to Staging

on:
  push:
    branches:
      - development
  workflow_dispatch:

env:
  NODE_VERSION: "20.x"

jobs:
  build-and-deploy:
    name: Build & Deploy to Staging
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build
        env:
          NODE_ENV: production
          VITE_BACKEND_URL: ${{ secrets.STAGING_BACKEND_URL }}
          VITE_GA4_MEASUREMENT_ID: ${{ secrets.STAGING_GA4_ID }}

      - name: Deploy to staging
        run: |
          echo "🚀 Deploying to staging environment..."
          # Example: Deploy to Vercel staging
          # npx vercel --token ${{ secrets.VERCEL_TOKEN }} --scope ${{ secrets.VERCEL_ORG }} --prod

          # Or deploy to custom server
          # scp -r dist/* ${{ secrets.STAGING_SERVER }}:/var/www/staging

          echo "✅ Deployment complete"

      - name: Run smoke tests
        run: |
          echo "🧪 Running smoke tests on staging..."
          # Add smoke tests here (e.g., checking if pages load)
          echo "✅ Smoke tests passed"

      - name: Notify on Slack (Optional)
        if: failure()
        run: |
          echo "❌ Staging deployment failed"
          # curl -X POST ${{ secrets.SLACK_WEBHOOK }} \
          #   -H 'Content-Type: application/json' \
          #   -d '{"text":"Staging deployment failed"}'
