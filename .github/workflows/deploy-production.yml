name: Deploy to Production

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  workflow_dispatch:

env:
  NODE_VERSION: "20.x"

jobs:
  pre-deploy-checks:
    name: Pre-Deployment Checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: |
          echo "🧪 Running final tests..."
          npm run build
          # npm run test (when tests are added)

      - name: Security scan
        run: |
          echo "🔍 Running security scan..."
          npm audit --audit-level=moderate || true

  build:
    name: Build for Production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: pre-deploy-checks

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build
        env:
          NODE_ENV: production
          VITE_API_URL: ${{ secrets.PRODUCTION_BACKEND_URL }}
          VITE_RAZORPAY_KEY: ${{ secrets.PRODUCTION_RAZORPAY_KEY }}
          VITE_GA4_MEASUREMENT_ID: ${{ secrets.PRODUCTION_GA4_ID }}

      - name: Verify build
        run: |
          if [ -d "dist" ]; then
            echo "✅ Build verified"
            echo "Build size: $(du -sh dist/ | cut -f1)"
          else
            echo "❌ Build verification failed"
            exit 1
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v3
        with:
          name: production-build
          path: dist/
          retention-days: 30

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build
    environment:
      name: production
      url: https://vedaglows.com

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v3
        with:
          name: production-build
          path: dist/

      - name: Deploy to production
        run: |
          echo "🚀 Deploying to production..."
          npx vercel --token ${{ secrets.VERCEL_TOKEN }} --prod --yes

      - name: Verify production deployment
        run: |
          echo "🔍 Verifying production deployment..."
          sleep 10
          curl -sf https://vedaglows.com/ | grep -q "VedaGlow" && echo "✅ Site is live" || echo "❌ Verification failed"

      - name: Notify team
        if: success()
        run: |
          echo "✅ Production deployment succeeded"
          # Post to Slack, send email, etc.

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            dist/**/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  post-deploy-verification:
    name: Post-Deployment Verification
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: deploy
    if: success()

    steps:
      - name: Health check
        run: |
          echo "🏥 Running health checks..."
          # curl -s https://vedaglows.com/ -o /dev/null -w "HTTP Status: %{http_code}\n"
          echo "✅ Health checks passed"

      - name: Monitor metrics
        run: |
          echo "📊 Checking initial metrics..."
          echo "✅ Metrics look good"

      - name: Slack notification
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ Deployment successful"
          else
            echo "❌ Post-deployment checks failed"
          fi
