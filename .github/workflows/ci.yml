name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - development
  pull_request:
    branches:
      - main
      - development

env:
  NODE_VERSION: "20.x"
  CACHE_VERSION: v1

jobs:
  lint-and-type-check:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install root dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint 2>&1 || true

      - name: Run TypeScript compiler
        run: npm run build 2>&1

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install root dependencies
        run: npm ci

      - name: Run npm audit (root)
        run: |
          echo "🔍 Auditing root dependencies..."
          npm audit --audit-level=moderate || npm audit --audit-level=moderate --force

      - name: Install server dependencies
        run: npm --prefix server ci

      - name: Run npm audit (server)
        run: |
          echo "🔍 Auditing server dependencies..."
          npm --prefix server audit --audit-level=moderate || npm --prefix server audit --audit-level=moderate --force

  build:
    name: Build Application
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [lint-and-type-check, security-audit]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install root dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build
        env:
          NODE_ENV: production

      - name: Check build output
        run: |
          if [ -d "dist" ]; then
            echo "✅ Build successful"
            du -sh dist/
            find dist -type f | wc -l
          else
            echo "❌ Build failed: dist directory not found"
            exit 1
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v3
        with:
          name: frontend-build
          path: dist/
          retention-days: 5

  bundle-analysis:
    name: Bundle Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v3
        with:
          name: frontend-build
          path: dist/

      - name: Analyze bundle size
        run: |
          echo "📦 Bundle Size Report"
          echo "===================="
          du -sh dist/
          echo ""
          echo "Top 10 Largest Files:"
          find dist -type f -exec du -h {} + | sort -rh | head -10

  server-build:
    name: Build Server
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [lint-and-type-check, security-audit]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install server dependencies
        run: npm --prefix server ci

      - name: Check server startup
        run: |
          echo "🔍 Checking server configuration..."
          npm --prefix server ls 2>&1 | head -20

  accessibility-check:
    name: Accessibility Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Check ARIA and semantic HTML
        run: |
          echo "🔍 Checking ARIA and semantic HTML..."
          grep -r "aria-" src/components/ | wc -l
          echo "ARIA attributes found in codebase"
          grep -r "<main" src/components/ | wc -l
          echo "Main landmarks found"

  final-report:
    name: Generate Final Report
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    needs:
      [
        lint-and-type-check,
        security-audit,
        build,
        bundle-analysis,
        server-build,
        accessibility-check,
      ]

    steps:
      - name: Print CI Status
        run: |
          echo "✅ Lint & Type Check: ${{ needs.lint-and-type-check.result }}"
          echo "✅ Security Audit: ${{ needs.security-audit.result }}"
          echo "✅ Build: ${{ needs.build.result }}"
          echo "✅ Bundle Analysis: ${{ needs.bundle-analysis.result }}"
          echo "✅ Server Build: ${{ needs.server-build.result }}"
          echo "✅ Accessibility Check: ${{ needs.accessibility-check.result }}"

      - name: Determine Overall Status
        run: |
          if [[ "${{ needs.lint-and-type-check.result }}" == "failure" || 
                "${{ needs.security-audit.result }}" == "failure" || 
                "${{ needs.build.result }}" == "failure" ]]; then
            echo "❌ CI/CD Pipeline Failed"
            exit 1
          fi
          echo "✅ CI/CD Pipeline Passed"
