<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#f0faf2"/>
      <stop offset="100%" stop-color="#e8f5ea"/>
    </radialGradient>
    <linearGradient id="leaf" x1="20%" y1="10%" x2="80%" y2="90%">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="50%" stop-color="#2e7d32"/>
      <stop offset="100%" stop-color="#1b5e20"/>
    </linearGradient>
    <radialGradient id="glow" cx="65%" cy="25%" r="40%">
      <stop offset="0%" stop-color="#fffde7" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#fffde7" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Rounded square background -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <!-- Leaf shape -->
  <path d="M32 10 C20 14, 10 26, 14 40 C18 52, 30 56, 38 50 C48 42, 52 28, 44 18 C40 12, 36 9, 32 10 Z" fill="url(#leaf)"/>
  <!-- Leaf vein -->
  <path d="M32 10 C30 24, 22 36, 14 40" stroke="rgba(255,255,255,0.35)" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <!-- Glow highlight -->
  <ellipse cx="40" cy="20" rx="10" ry="8" fill="url(#glow)" transform="rotate(-30 40 20)"/>
</svg>
